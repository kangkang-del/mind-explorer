[build]
  command = "node node_modules/vite/bin/vite.js build"
  publish = "dist"
  functions = "netlify/functions"

# 每日定时推送「心灵晴天」内容（同时让免费版 Supabase 保持活跃，避免 7 天不活跃被暂停）
# cron 为 UTC 时区：0 1 * * * = 每天 UTC 01:00（北京时间 09:00）
# 注意：定时触发时没有 HTTP 请求，函数内已兼容；且仅生产部署真正执行（见 sunny-push.js 环境闸门）
[functions."sunny-push"]
  schedule = "0 1 * * *"

# SPA fallback: 所有前端路由都返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTML 文件不缓存，确保用户总是看到最新版本
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# JS/CSS 文件缓存 7 天（加了哈希版本号）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
