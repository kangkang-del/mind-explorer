[build]
  command = "node node_modules/vite/bin/vite.js build"
  publish = "dist"
  functions = "netlify/functions"

# 函数打包：node_bundler = "none" 让 ESM 源码原样部署（跳过 esbuild/zisi 打包器）
# —— 修复线上「module is not defined in ES module scope」崩溃：打包器把 ESM 函数打成
#    CJS bundle 后与 /var/task/package.json 的 type:module 冲突。源码本身是 ESM
#    （export const handler），配合 functions/package.json 的 type:module 按 ESM 加载。
# included_files 基准 = base 目录（mind-explorer-vue）：
#   _lib/ 是 community/companion/mood/user-cards 的相对依赖，必须随包带上；
#   functions/package.json 声明 ESM，避免 Node 按 CJS 解析 export 语法。
[functions]
  node_bundler = "none"
  included_files = ["netlify/functions/_lib/**", "netlify/functions/package.json"]

# 「小木」陪伴对话函数：超时控制改由 companion.js 的 AbortSignal.timeout(8000) 主动兜底，
# 不再依赖 netlify.toml 的 timeout 配置（Netlify 文档标注同步函数超时不可配置；旧 Free /
# Starter 计划实际为 10s 上限，设更高值无效甚至可能导致部署异常）。abort 设为 8s < 10s，
# 保证函数主动返回兜底话术，而非被平台硬杀进程（"lambda: 0" / 502）。
# 配合 prompt 压缩 44%，正常回复 2-4 句（80-180 token）多可在 8s 内完成；若偶发超时，
# catch 会返回"刚才走神了，你再说一次？"而非崩溃。

# 0012：每日推送已迁移到 Supabase Edge Function content（action: sunny.push，LLM 生成 +
# 小木名义 3 条善意 + 语录 + 每日一卡 + 3 图 + 小木卡片 3 条，双幂等）。
# 定时触发改由 .github/workflows/sunny-push.yml 直连 content 函数完成（北京时间 08:00），
# 前端打开首页/心灵晴天时也会兜底懒触发。此处不再配置 Netlify 版 sunny-push 的 schedule，
# 避免旧逻辑（Netlify cron）与新逻辑（content）同写一个库造成「每天推两套内容」。
# 旧 netlify/functions/sunny-push.js 仍随包部署但不再被调度/调用，后续可整体下线。

# SPA fallback: 所有前端路由都返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTML 文件不缓存，确保用户总是看到最新版本
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# JS/CSS 文件缓存 7 天（加了哈希版本号）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
