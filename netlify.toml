[build]
  # 最终结构：Vue 应用位于 mind-explorer-vue/ 子目录
  base = "mind-explorer-vue"
  # C4：用 npm ci 而不是 npm install —— 严格按 package-lock.json 装，依赖不会漂移。
  # lock 的 resolved 已从 mirrors.tencent.com 改回 registry.npmjs.org（构建机在海外，
  # 国内镜像既慢又可能直接失败；2026-10-30 本地以官方源跑过一次洁净 npm ci 验证通过）。
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ⚠️ 本段必须与 mind-explorer-vue/netlify.toml 里的 [functions] 保持一致。
# 仓库里存在两份 netlify.toml（根 + base 目录），Netlify 官方文档没有明确写死
# 「base 目录与仓库根同时存在时谁优先」——只说路径相对 base 解析、netlify.toml 覆盖 UI。
# 因此这里补成自给自足：无论哪一份生效，函数打包方式都相同，避免「哪天换了优先级，
# 线上 Netlify 函数突然被重新 bundle 成 CJS」这类难以复现的故障。
#
# node_bundler = "none"：让 ESM 源码原样部署（跳过 esbuild/zisi）。打包器会把
# （export const handler）打成 CJS bundle，与 functions/package.json 的 type:module
# 冲突，运行时抛 "module is not defined in ES module scope"。
# included_files 基准 = base 目录 = mind-explorer-vue：
#   _lib/ 是 community/companion/mood/user-cards 的相对依赖，必须随包带上；
#   functions/package.json 声明 ESM，避免 Node 按 CJS 解析 export 语法。
[functions]
  node_bundler = "none"
  included_files = ["netlify/functions/_lib/**", "netlify/functions/package.json"]

# SPA fallback: 所有前端路由都返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# [S1 2026-11-10] 基础安全响应头。必须与 mind-explorer-vue/netlify.toml 保持一致。
# ⚠️ Permissions-Policy 的 microphone 必须是 (self)，不能写 ()：
#    小木的语音输入走 getUserMedia（src/companion/composables/useMicCapture.js），
#    写成 microphone=() 会在功能启用时直接把它打死。
# ⚠️ 这里没有 CSP：Vite 产物有 23 处内联 :style 绑定，style-src 必须带 'unsafe-inline'
#    才不白屏，而带上之后 CSP 的防护价值已经很小。真要上，先 Report-Only 单独跑一段。
#    真正的 XSS 面是 4 处 v-html（CardDetail 渲染用户提交的卡片内容），应在彼处消毒。
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"

# HTML 文件不缓存，确保用户总是看到最新版本
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# JS/CSS 文件缓存 7 天（加了哈希版本号）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
